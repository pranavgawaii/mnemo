<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" style="background:#FFFFFF;font-family:Outfit,Arial,sans-serif"  viewBox="0 0 880 650" role="img" aria-labelledby="system-arrow-R0-title system-arrow-R0-desc"><rect width="880" height="650" rx="16" fill="#FFFFFF"/><title id="system-arrow-R0-title">Mnemo deployment and data paths</title><desc id="system-arrow-R0-desc">A user interacts with their application, which calls its model and the Mnemo API. FastAPI, the memory service, local encoder and background worker share one Python process. The service reads and writes PostgreSQL and pgvector. The worker polls persisted jobs and delivers signed webhooks to an optional receiver. The browser demo is separate.</desc><defs><marker id="system-arrow-R0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#817AB8" stroke-width="1.2"></path></marker></defs><g font-family="inherit"><g transform="translate(28 22)"><rect width="174" height="76" rx="9" fill="#FFFFFF" stroke="#DEDFE4"></rect><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true" x="14" y="17"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><text x="46" y="29" fill="#0A0A0F" font-size="14" font-weight="500">User</text><text x="14" y="57" fill="#5E6472" font-size="11.5">Facts and questions</text></g><g transform="translate(302 22)"><rect width="260" height="76" rx="9" fill="#FFFFFF" stroke="#DEDFE4"></rect><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true" x="14" y="17"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg><text x="46" y="29" fill="#0A0A0F" font-size="14" font-weight="500">Your application / agent</text><text x="14" y="57" fill="#5E6472" font-size="11.5">Conversation · model integration</text></g><g transform="translate(662 22)"><rect width="190" height="76" rx="9" fill="#FFFFFF" stroke="#DEDFE4"></rect><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true" x="14" y="17"><path d="M12 20v2"></path><path d="M12 2v2"></path><path d="M17 20v2"></path><path d="M17 2v2"></path><path d="M2 12h2"></path><path d="M2 17h2"></path><path d="M2 7h2"></path><path d="M20 12h2"></path><path d="M20 17h2"></path><path d="M20 7h2"></path><path d="M7 20v2"></path><path d="M7 2v2"></path><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg><text x="46" y="29" fill="#0A0A0F" font-size="14" font-weight="500">Your model</text><text x="14" y="57" fill="#5E6472" font-size="11.5">Generates the answer</text></g><g fill="none" stroke="#817AB8" stroke-width="1.4" marker-end="url(#system-arrow-R0)"><path d="M202 60H292"></path><path d="M572 60H652" marker-start="url(#system-arrow-R0)"></path><path d="M432 98V137H16V255H38"></path></g><text x="252" y="49" text-anchor="middle" fill="#5E6472" font-size="11">chat</text><text x="612" y="49" text-anchor="middle" fill="#5E6472" font-size="11">context</text><text x="275" y="126" text-anchor="middle" fill="#5E6472" font-size="11">REST / Python SDK · X-API-Key</text><rect x="28" y="167" width="558" height="302" rx="13" fill="#F7F7F5" stroke="#C4C0E7" stroke-dasharray="5 5"></rect><text x="47" y="191" fill="#3730A3" font-size="12" font-weight="500">Mnemo · one Python API process</text><g transform="translate(48 217)"><rect width="198" height="76" rx="9" fill="#FFFFFF" stroke="#DEDFE4"></rect><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true" x="14" y="17"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"></rect><rect width="20" height="8" x="2" y="14" rx="2" ry="2"></rect><line x1="6" x2="6.01" y1="6" y2="6"></line><line x1="6" x2="6.01" y1="18" y2="18"></line></svg><text x="46" y="29" fill="#0A0A0F" font-size="14" font-weight="500">FastAPI</text><text x="14" y="57" fill="#5E6472" font-size="11.5">Auth · validation · observability</text></g><g transform="translate(316 217)"><rect width="250" height="76" rx="9" fill="#EEF0FF" stroke="#BDB9F5"></rect><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true" x="14" y="17"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg><text x="46" y="29" fill="#0A0A0F" font-size="14" font-weight="500">Memory service</text><text x="14" y="57" fill="#5E6472" font-size="11.5">Store · search · rank · review</text></g><g transform="translate(316 366)"><rect width="250" height="76" rx="9" fill="#FFFFFF" stroke="#DEDFE4"></rect><svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true" x="14" y="17"><path d="M12 20v2"></path><path d="M12 2v2"></path><path d="M17 20v2"></path><path d="M17 2v2"></path><path d="M2 12h2"></path><path d="M2 17h2"></path><path d="M2 7h2"></path><path d="M20 12h2"></path><path d="M20 17h2"></path><path d="M20 7h2"></path><path d="M7 20v2"></path><