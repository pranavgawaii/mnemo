# Python packaging for the Mnemo API service.
#
# requirements-api.txt stays the operational source of truth (CI, Dockerfile,
# quickstart). This file makes `pip install .` and `pip install -e .[dev]` work
# so the service can be consumed as a normal Python package. The pins below
# MUST stay identical to requirements-api.txt.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-api"
version = "1.0.0"
description = "Semantic memory service for AI agents: pgvector search, decay scoring, contradiction detection."
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sentence-transformers==3.3.1",
    "numpy==2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
# Keep imports tidy and catch real mistakes; formatting is left to the authors
# so the diff of enabling linting stays reviewable.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in parameter defaults is the idiomatic FastAPI pattern.
"app/api/*" = ["B008"]
"app/main.py" = ["B008"]


[tool.mypy]
python_version = "3.12"
# pgvector ships no type stubs; everything else in the stack is typed.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["alembic/"]

