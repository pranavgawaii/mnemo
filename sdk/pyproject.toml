[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-sdk"
version = "1.0.0"
description = "Python SDK for the Mnemo semantic memory API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Pranav Gawai", email = "pranavvgawai@gmail.com" }]
keywords = ["memory", "agents", "semantic-search", "embeddings", "pgvector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/pranavgawaii/mnemo"
Documentation = "https://github.com/pranavgawaii/mnemo/tree/main/sdk"

[tool.setuptools]
packages = ["mnemo"]

[tool.setuptools.package-data]
mnemo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
